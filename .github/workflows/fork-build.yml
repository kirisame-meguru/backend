# [remnawave-fork] Self-contained panel image build for the per-user-per-inbound fork.
# Builds the backend (panel) image and pushes to GHCR using the built-in GITHUB_TOKEN.
# The Dockerfile's frontend stage pulls the fork's remnawave-frontend.zip from the
# `perinbound` release on the frontend fork — run fork-frontend.yml there FIRST.
# See ../../FORK-RESILIENCE.md.
name: fork-build (backend)

on:
  push:
    branches: [per-user-per-inbound-traffic-stats]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/backend:perinbound
