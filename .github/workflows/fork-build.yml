# [remnawave-fork] Publish only with the exact, successful frontend artifact pinned in Dockerfile.
name: fork-build (backend)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-backend
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check artifact gate
        run: bash .github/scripts/verify-frontend.test.sh

      - name: Verify pinned frontend release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRONTEND_REPO: ${{ github.repository_owner }}/frontend
        run: |
          bash .github/scripts/verify-frontend.sh "$FRONTEND_REPO" \
            "$(sed -n 's/^ARG FRONTEND_COMMIT=//p' Dockerfile)" \
            "$(sed -n 's/^ARG FRONTEND_SHA256=//p' Dockerfile)"

      - name: Prepare image metadata
        id: metadata
        run: |
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
          echo "frontend=$(sed -n 's/^ARG FRONTEND_COMMIT=//p' Dockerfile)" >> "$GITHUB_OUTPUT"
          echo "build-time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/backend:perinbound
            ghcr.io/${{ github.repository_owner }}/backend:sha-${{ github.sha }}
          build-args: |
            __RW_METADATA_VERSION=${{ steps.metadata.outputs.version }}
            __RW_METADATA_GIT_BACKEND_COMMIT=${{ github.sha }}
            __RW_METADATA_GIT_FRONTEND_COMMIT=${{ steps.metadata.outputs.frontend }}
            __RW_METADATA_GIT_BRANCH=${{ github.ref_name }}
            __RW_METADATA_BUILD_TIME=${{ steps.metadata.outputs.build-time }}
            __RW_METADATA_BUILD_NUMBER=${{ github.run_number }}
